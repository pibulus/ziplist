<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · ZipList</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #fffef7;
        --card: #fbf1e4;
        --ink: #1e1714;
        --ink-soft: #4a3f3a;
        --cta: #ffb000;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: var(--bg);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        margin: 0;
        padding: 20px;
        text-align: center;
      }

      .container {
        width: 100%;
        max-width: 420px;
        background-color: var(--card);
        border: 2px solid var(--ink);
        border-radius: 24px;
        padding: 32px 26px;
        box-shadow: 4px 4px 0 var(--ink);
      }

      .icon {
        width: 84px;
        height: 84px;
        margin: 0 auto 16px;
      }

      .icon svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      h1 {
        font-size: 1.65rem;
        font-weight: 900;
        letter-spacing: -0.02em;
        margin: 0 0 10px;
        color: var(--ink);
      }

      p {
        font-size: 0.98rem;
        font-weight: 600;
        line-height: 1.55;
        color: var(--ink-soft);
        margin: 0 0 22px;
      }

      .button {
        width: 100%;
        min-height: 48px;
        background: var(--cta);
        color: var(--ink);
        font-size: 0.95rem;
        font-weight: 900;
        padding: 12px 20px;
        border-radius: 14px;
        border: 2px solid var(--ink);
        box-shadow: 3px 3px 0 var(--ink);
        cursor: pointer;
        transition:
          transform 0.14s ease,
          box-shadow 0.14s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        box-shadow: 4px 4px 0 var(--ink);
      }

      .button:active {
        transform: translateY(1px);
        box-shadow: 1px 1px 0 var(--ink);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="icon" aria-hidden="true">
        <svg viewBox="96 56 832 872" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient
              id="ziplistOfflineGrad"
              x1="150"
              y1="130"
              x2="860"
              y2="820"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0" stop-color="#ffe86b" />
              <stop offset="0.42" stop-color="#ff9a8c" />
              <stop offset="1" stop-color="#76ead7" />
            </linearGradient>
          </defs>
          <path
            d="M308 118H716C815 118 878 181 878 280V574C878 673 815 736 716 736H600L542 846C529 870 495 870 482 846L424 736H308C209 736 146 673 146 574V280C146 181 209 118 308 118Z"
            fill="url(#ziplistOfflineGrad)"
            stroke="#1e1714"
            stroke-width="54"
            stroke-linejoin="round"
          />
          <ellipse cx="424" cy="326" rx="39" ry="60" fill="#1e1714" />
          <ellipse cx="600" cy="326" rx="39" ry="60" fill="#1e1714" />
          <g
            fill="none"
            stroke="#1e1714"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect
              x="334"
              y="520"
              width="44"
              height="44"
              rx="6"
              stroke-width="18"
            />
            <path d="M430 542H690" stroke-width="21" />
            <rect
              x="334"
              y="598"
              width="44"
              height="44"
              rx="6"
              stroke-width="18"
            />
            <path d="M430 620H690" stroke-width="21" />
          </g>
        </svg>
      </div>

      <h1>No signal right now.</h1>

      <p>
        Saved lists still open and tick off on this device. Voice adds return
        once a connection is back.
      </p>

      <button class="button" type="button" onclick="location.reload()">
        Open saved lists
      </button>
    </main>
  </body>
</html>
