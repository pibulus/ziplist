# ZipList live rooms, on Pablo's own Cloudflare account.
#
# Replaces partykit.json. PartyKit's deploy pipeline broke when Cloudflare
# started requiring SQLite-backed namespaces for free-plan Durable Objects —
# that's the `new_sqlite_classes` migration below, the one PartyKit never
# shipped and now never will.

name = "ziplist-rooms"
main = "worker/index.ts"
compatibility_date = "2026-05-26"

[[durable_objects.bindings]]
name = "LIST_ROOM"
class_name = "ListRoom"

# SQLite-backed, which is what the free plan requires. Same get/put/delete
# storage API as before, so nothing in the room logic changed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ListRoom"]

# Edge rate limiter for room lookups. Counted before any Durable Object is
# instantiated, which is the point: a phrase-derived room id is ~28 bits, and
# that only holds up while guessing costs something. Free probing made the
# keyspace decorative.
[[ratelimits]]
name = "ROOM_PROBE_LIMIT"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

[observability]
enabled = true
