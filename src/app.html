<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Theme-aware favicons -->
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
      sizes="any"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.png"
      sizes="32x32"
      type="image/png"
    />
    <link
      rel="shortcut icon"
      href="%sveltekit.assets%/favicon.png"
      type="image/png"
    />
    <link
      rel="mask-icon"
      href="%sveltekit.assets%/safari-pinned-tab.svg"
      color="#ffb000"
    />

    <!-- Apple touch icons for all device sizes -->
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />

    <!-- App configuration -->
    <!-- NO per-page metadata in this file. It is emitted BEFORE the head
         placeholder below, so whatever it declares wins over what the route
         declares. A hardcoded title element and description meta lived here
         and shadowed every route's own on every page — which is how
         /es/mandado came to show the English homepage title in the tab and in
         search results. Titles, descriptions, canonicals, og/twitter and
         hreflang all belong to PageLayout, which takes them as props.
         (Tag syntax and the sveltekit placeholder tokens are spelled out in
         words on purpose. Literal markup inside a comment still ships and
         breaks tag-counting audits — and a literal placeholder token is
         worse: Kit substitutes the FIRST one it finds, so a token in this
         comment swallows the real head, the injected markup's own comment
         markers close this comment early, and the prose lands on the page.) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="author" content="Pablo" />
    <meta name="application-name" content="ZipList" />
    <meta name="color-scheme" content="light" />

    <!-- No Open Graph tags here on purpose: they conflicted with the ones
         each page already emits and Messenger rendered no card at all. Every
         shareable route sets its own. See CHANGELOG 2026-09-11.
         Verify: exactly one canonical-url OG meta per page, and the declared
         image dimensions must match og-card.png (1200x630). -->

    <!-- Manifest -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />

    <!-- PWA related meta tags -->
    <meta name="theme-color" content="#FFF6E6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ZipList" />
    <meta name="msapplication-TileColor" content="#FFF6E6" />

    <!-- iOS specific splash screens (main sizes) -->
    <link
      rel="apple-touch-startup-image"
      href="%sveltekit.assets%/splash/apple-splash-2048x2732.png"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%sveltekit.assets%/splash/apple-splash-1668x2388.png"
      media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%sveltekit.assets%/splash/apple-splash-1536x2048.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%sveltekit.assets%/splash/apple-splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%sveltekit.assets%/splash/apple-splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%sveltekit.assets%/splash/apple-splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%sveltekit.assets%/splash/apple-splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%sveltekit.assets%/splash/apple-splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%sveltekit.assets%/splash/apple-splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />

    <script>
      // Apply saved theme immediately to prevent flash of default theme
      // StorageUtils inline helpers
      function getStorageItem(key, defaultValue) {
        if (typeof localStorage === "undefined") return defaultValue;

        try {
          const item = localStorage.getItem(key);
          return item !== null ? item : defaultValue;
        } catch (e) {
          console.warn(`Error reading ${key} from localStorage:`, e);
          return defaultValue;
        }
      }

      function setStorageItem(key, value) {
        if (typeof localStorage === "undefined") return false;

        try {
          localStorage.setItem(key, value);
          return true;
        } catch (e) {
          console.warn(`Error saving ${key} to localStorage:`, e);
          return false;
        }
      }

      // Apply theme using storage helpers
      // "The Desk Drawer" roster (re-cut 2026-07-21). Any stale saved
      // theme not in this list (e.g. a retired one from an older roster)
      // falls back cleanly to DEFAULT_THEME below — never breaks.
      const THEME_KEY = "ziplist-vibe";
      const DEFAULT_THEME = "highlighter";
      const ALLOWED_THEMES = [
        "highlighter",
        "sticky-note",
        "gel-pen",
        "legal-pad",
      ];

      let savedTheme = getStorageItem(THEME_KEY, DEFAULT_THEME);
      if (!ALLOWED_THEMES.includes(savedTheme)) {
        savedTheme = DEFAULT_THEME;
        setStorageItem(THEME_KEY, DEFAULT_THEME);
      }
      document.documentElement.setAttribute("data-theme", savedTheme);
      window.__theme = savedTheme;

      // Check for chunky mode preference, default to true for pop-punk
      const CHUNKY_MODE_KEY = "ziplist-chunky-mode";
      const savedChunkyMode = getStorageItem(CHUNKY_MODE_KEY, "true");

      if (savedChunkyMode === "true") {
        document.documentElement.classList.add("mode-neo-brutalist");
      }

      // Apply list-first layout flag before paint so the hero never flashes
      // and collapses on hydration for users in list-first mode.
      if (getStorageItem("ziplist-list-first-mode", "false") === "true") {
        document.documentElement.setAttribute("data-list-first", "true");
      }

      // Pre-read stored lists so pre-hydration HTML matches hydrated layout:
      // 1. Reserve card space so nothing jumps when JS mounts.
      // 2. Match CTA copy ("Talk a list" vs "Add more") from millisecond 0
      //    so the primary button label never snaps mid-paint.
      try {
        const storedLists = localStorage.getItem("ziplist-lists");
        if (storedLists && storedLists.includes('"text"')) {
          document.documentElement.setAttribute("data-booting-lists", "true");
          const parsed = JSON.parse(storedLists);
          if (Array.isArray(parsed) && parsed.length > 0) {
            const savedActiveId = localStorage.getItem(
              "ziplist-active-list-id",
            );
            const active =
              parsed.find((l) => l && l.id === savedActiveId) || parsed[0];
            const hasUserItems =
              Array.isArray(active?.items) &&
              active.items.some(
                (item) =>
                  item &&
                  typeof item.text === "string" &&
                  !String(item.id || "").startsWith("starter-"),
              );
            if (hasUserItems) {
              document.documentElement.setAttribute("data-has-items", "true");
            }
          }
        }
      } catch (e) {
        // A blocked or malformed localStorage simply falls back to defaults.
      }

      // Set initialization flag to prevent duplicate theme application
      window.themeInitialized = true;
    </script>

    <!-- Critical zero-FOUC shell styles: paints the warm cream ground, hides
         closed dialogs/skip-links, and bounds inline SVGs immediately even if
         external stylesheets are still downloading over cellular/cold CDN. -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #fff6e6;
        color: #1e1714;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      body {
        min-height: 100dvh;
        background-image: radial-gradient(
          circle at 50% 35%,
          #fff8ed 0%,
          #fff6e6 52%,
          #fff3df 82%,
          #ffefda 100%
        );
      }

      .skip-link:not(:focus) {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        transform: translateY(-200%);
      }

      dialog:not([open]) {
        display: none !important;
      }

      [popover]:not(:popover-open) {
        display: none;
      }

      .sr-only,
      .zl-visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      svg.mascot-svg {
        display: block;
        width: 112px;
        height: 118px;
        max-width: 100%;
        margin: 0 auto;
      }

      svg.cta__glyph {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      svg.compact-glyph {
        width: 26px;
        height: 26px;
      }

      svg.modal-close-glyph,
      svg.zl-header-icon {
        width: 18px;
        height: 18px;
      }

      svg.zl-check-svg {
        width: 16px;
        height: 16px;
        fill: none;
        opacity: 0;
      }

      svg.zl-item-handle-icon,
      .nav-arrow svg {
        width: 20px;
        height: 20px;
      }

      svg.zl-pill-icon,
      svg.zl-tray-icon {
        width: 15px;
        height: 15px;
      }

      html[data-list-first="true"] .title-container,
      html[data-list-first="true"] .slide-in-subtitle {
        display: none !important;
      }
    </style>

    %sveltekit.head%
    <script
      defer
      src="https://fleetcount.pibulus.deno.net/beacon.js"
      data-site="ziplist.app"
    ></script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- A visually-hidden top-level heading lived here, carrying the English
         homepage headline on EVERY route. It duplicated the real hero heading
         on the app pages and contradicted the visible Spanish copy on /es/* —
         hidden text disagreeing with the page it sits on, which is what
         search engines penalise. AnimatedTitle renders the real one. -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
